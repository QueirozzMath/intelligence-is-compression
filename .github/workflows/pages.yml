name: Publish interactive presentation

on:
  push:
    branches: [main, feat/final-visual-overhaul]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/deliverables _site/results
          cp -R web _site/web
          cp -R deliverables/. _site/deliverables/
          cp -R results/figures _site/results/figures
          cp results/summary.md _site/results/summary.md
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
