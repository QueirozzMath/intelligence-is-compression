[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligence-is-compression"
version = "0.1.0"
description = "Áreas do conhecimento vistas pela compressão, sem redes neurais"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8",
  "PyYAML>=6.0", "scikit-learn>=1.4", "nltk>=3.8", "requests>=2.31", "tabulate>=0.9"
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

